[package]
name = "dressed-trajectory-fields"
version = "1.0.0"
edition = "2021"
authors = ["Angshul Majumdar"]
description = "Rust reproduction repository for Dressed Trajectory Fields: Generated Temporal Nonlocality in Conditioned Stochastic Dynamics"

[dependencies]
anyhow = "1"
csv = "1"
nalgebra = "0.33"
rand = "0.8"
